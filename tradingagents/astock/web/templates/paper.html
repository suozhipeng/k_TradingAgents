{% extends "base.html" %}
{% block title %}Paper Trading — AStock WebUI{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">💼 模拟盘 Paper Trading</h2>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h3 class="text-lg font-semibold text-white mb-4">📊 账户状态 Account State</h3>
    <div id="paper-state" class="text-gray-400 text-sm">Loading...</div>
  </div>
  <div class="card">
    <h3 class="text-lg font-semibold text-white mb-4">📋 持仓 Positions</h3>
    <div id="paper-positions" class="text-gray-400 text-sm overflow-x-auto">Loading...</div>
  </div>
</div>

<div class="card mt-6">
  <h3 class="text-lg font-semibold text-white mb-4">📋 成交记录 Trades</h3>
  <div id="paper-trades" class="text-gray-400 text-sm overflow-x-auto">Loading...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadPaper() {
  try {
    const [stateRes, tradesRes] = await Promise.all([
      fetch('/api/v1/paper/state'),
      fetch('/api/v1/paper/trades?limit=50'),
    ]);
    const state = await stateRes.json();
    const trades = await tradesRes.json();

    const ps = document.getElementById('paper-state');
    if (state) {
      ps.innerHTML = `<div class="grid grid-cols-2 gap-4">
        <div class="bg-dark-bg rounded-lg p-3"><div class="stat-label">总资产</div><div class="stat-value text-emerald-400">¥${(state.total_asset ?? 0).toFixed(2)}</div></div>
        <div class="bg-dark-bg rounded-lg p-3"><div class="stat-label">现金</div><div class="stat-value">¥${(state.cash ?? 0).toFixed(2)}</div></div>
        <div class="bg-dark-bg rounded-lg p-3"><div class="stat-label">持仓市值</div><div class="stat-value text-sky-400">¥${(state.position_value ?? 0).toFixed(2)}</div></div>
        <div class="bg-dark-bg rounded-lg p-3"><div class="stat-label">收益率</div><div class="stat-value ${(state.return_pct ?? 0) >= 0 ? 'text-emerald-400' : 'text-red-400'}">${(state.return_pct ?? 0).toFixed(2)}%</div></div>
      </div>`;
    } else {
      ps.textContent = 'No account state.';
    }

    const pp = document.getElementById('paper-positions');
    if (state?.positions?.length) {
      pp.innerHTML = '<table><thead><tr><th>Symbol</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th></tr></thead><tbody>' +
        state.positions.map(p =>
          `<tr>
            <td class="text-gray-300 font-medium">${p.symbol}</td>
            <td>${p.quantity ?? p.shares ?? 0}</td>
            <td>${(p.avg_cost ?? 0).toFixed(2)}</td>
            <td>${(p.current_price ?? 0).toFixed(2)}</td>
            <td class="${(p.pnl ?? 0) >= 0 ? 'text-emerald-400' : 'text-red-400'}">${(p.pnl ?? 0).toFixed(2)}</td>
          </tr>`
        ).join('') + '</tbody></table>';
    } else {
      pp.innerHTML = '<p class="text-gray-500">No open positions.</p>';
    }

    const pt = document.getElementById('paper-trades');
    if (trades?.trades?.length) {
      pt.innerHTML = '<table><thead><tr><th>时间</th><th>Symbol</th><th>方向</th><th>价格</th><th>数量</th></tr></thead><tbody>' +
        trades.trades.slice(0, 50).map(t =>
          `<tr>
            <td class="text-gray-300 text-xs">${t.trade_date || t.time || ''}</td>
            <td>${t.symbol}</td>
            <td><span class="badge ${t.side === 'buy' || t.direction === 'buy' ? 'badge-success' : 'badge-error'}">${t.side || t.direction || ''}</span></td>
            <td>${(t.price ?? 0).toFixed(2)}</td>
            <td>${t.quantity ?? t.shares ?? 0}</td>
          </tr>`
        ).join('') + '</tbody></table>';
    } else {
      pt.innerHTML = '<p class="text-gray-500">No trades yet.</p>';
    }
  } catch (e) {
    ['paper-state', 'paper-positions', 'paper-trades'].forEach(id =>
      document.getElementById(id).innerHTML = '<p class="text-red-400">Failed to load.</p>'
    );
  }
}
loadPaper();
</script>
{% endblock %}
