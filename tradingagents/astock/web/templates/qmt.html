{% extends "base.html" %}
{% block title %}QMT Bridge — AStock WebUI{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">🔗 QMT 桥接 QMT Bridge</h2>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div class="card">
    <h3 class="text-lg font-semibold text-white mb-4">🔌 连接状态 Status</h3>
    <div id="qmt-status" class="text-gray-400 text-sm">Loading...</div>
  </div>
  <div class="card">
    <h3 class="text-lg font-semibold text-white mb-4">📋 持仓 Positions</h3>
    <div id="qmt-positions" class="text-gray-400 text-sm overflow-x-auto">Loading...</div>
  </div>
  <div class="card">
    <h3 class="text-lg font-semibold text-white mb-4">📋 订单 Orders</h3>
    <div id="qmt-orders" class="text-gray-400 text-sm overflow-x-auto">Loading...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadQmt() {
  try {
    const [healthRes, posRes, ordRes] = await Promise.all([
      fetch('/api/v1/qmt/health'),
      fetch('/api/v1/qmt/positions'),
      fetch('/api/v1/qmt/orders'),
    ]);
    const health = await healthRes.json();
    const positions = await posRes.json();
    const orders = await ordRes.json();

    const qs = document.getElementById('qmt-status');
    const connected = health?.connected ?? health?.status === 'ok';
    qs.innerHTML = `<div class="flex items-center gap-2 mb-3">
      <span class="w-3 h-3 rounded-full ${connected ? 'bg-emerald-400' : 'bg-red-400'}"></span>
      <span class="text-lg font-semibold ${connected ? 'text-emerald-400' : 'text-red-400'}">${connected ? '已连接' : '未连接'}</span>
    </div>
    <div class="text-xs text-gray-500">${health?.message || health?.detail || ''}</div>`;

    const qp = document.getElementById('qmt-positions');
    if (positions?.positions?.length) {
      qp.innerHTML = '<table><thead><tr><th>Symbol</th><th>数量</th><th>成本</th></tr></thead><tbody>' +
        positions.positions.map(p =>
          `<tr><td class="text-gray-300">${p.symbol}</td><td>${p.quantity ?? p.shares ?? 0}</td><td>${(p.avg_price ?? p.avg_cost ?? 0).toFixed(2)}</td></tr>`
        ).join('') + '</tbody></table>';
    } else {
      qp.innerHTML = '<p class="text-gray-500">No positions.</p>';
    }

    const qo = document.getElementById('qmt-orders');
    if (orders?.orders?.length) {
      qo.innerHTML = '<table><thead><tr><th>ID</th><th>Symbol</th><th>方向</th><th>状态</th></tr></thead><tbody>' +
        orders.orders.map(o =>
          `<tr>
            <td class="text-xs text-gray-300">${o.id?.substring(0, 8) || ''}</td>
            <td>${o.symbol}</td>
            <td><span class="badge ${o.side === 'buy' ? 'badge-success' : 'badge-error'}">${o.side || ''}</span></td>
            <td><span class="badge badge-info">${o.status || ''}</span></td>
          </tr>`
        ).join('') + '</tbody></table>';
    } else {
      qo.innerHTML = '<p class="text-gray-500">No orders.</p>';
    }
  } catch (e) {
    document.getElementById('qmt-status').innerHTML = '<p class="text-red-400">Failed to load.</p>';
    document.getElementById('qmt-positions').innerHTML = '<p class="text-red-400">Failed to load.</p>';
    document.getElementById('qmt-orders').innerHTML = '<p class="text-red-400">Failed to load.</p>';
  }
}
loadQmt();
</script>
{% endblock %}
