{% extends "base.html" %}
{% block title %}Dragon & Tiger — AStock WebUI{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">🐉 龙虎榜 Dragon & Tiger</h2>

<div class="card mb-6">
  <p class="text-xs text-gray-400 mb-4">全市场龙虎榜 — 每日上榜股票、席位买卖净额、上榜原因。数据来源：东方财富。</p>

  <div class="flex flex-wrap gap-4 items-end mb-4">
    <div>
      <label class="block text-xs text-gray-400 mb-1">日期 Date</label>
      <input type="text" id="dt-date" class="w-40" placeholder="YYYY-MM-DD" value="{{ today }}">
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">最小净买入(万元)</label>
      <input type="number" id="dt-min-buy" class="w-32" value="0" min="0">
    </div>
    <div class="flex items-end gap-2">
      <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer px-3 py-1.5 bg-dark-bg rounded-lg">
        <input type="checkbox" id="dt-mock" class="accent-indigo-500" checked>
        使用 Mock 数据
      </label>
      <button onclick="loadDragonTiger()" class="btn btn-primary">🔍 查询 Query</button>
    </div>
  </div>
  <span id="dt-status" class="text-xs text-gray-400"></span>
</div>

<div id="dt-results" class="hidden">
  <div class="card mb-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-white">📋 龙虎榜结果</h3>
      <span id="dt-count" class="text-xs text-gray-400"></span>
    </div>
    <div id="dt-table" class="overflow-x-auto"></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <div class="card">
      <h3 class="text-lg font-semibold text-white mb-4">📊 净买入 TOP 10</h3>
      <canvas id="chart-dt-top" height="250"></canvas>
    </div>
    <div class="card">
      <h3 class="text-lg font-semibold text-white mb-4">📈 上榜原因分布</h3>
      <canvas id="chart-dt-reason" height="250"></canvas>
    </div>
  </div>
</div>
{% endblock %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% endblock %}

{% block scripts %}
<script>
let dtChartInstances = {};

async function loadDragonTiger() {
  const date = document.getElementById('dt-date').value.trim() || '{{ today }}';
  const minBuy = document.getElementById('dt-min-buy').value || '0';
  const useMock = document.getElementById('dt-mock').checked;
  const status = document.getElementById('dt-status');

  status.textContent = '⏳ 查询中...';
  document.getElementById('dt-results').classList.add('hidden');
  destroyDtCharts();

  try {
    const params = new URLSearchParams({
      date, min_net_buy: minBuy, mock: useMock ? '1' : '0',
    });
    const res = await fetch(`/api/v1/market/dragon-tiger?${params}`);
    const data = await res.json();

    if (data.error) { status.textContent = '❌ ' + data.error; return; }

    const stocks = data.stocks || [];
    if (stocks.length === 0) {
      document.getElementById('dt-table').innerHTML =
        '<p class="text-gray-500">' + (data.note || '暂无数据。') + '</p>';
      status.textContent = '⚠️ 无数据';
      document.getElementById('dt-results').classList.remove('hidden');
      return;
    }

    document.getElementById('dt-count').textContent =
      `共 ${data.total_records} 条记录 | ${data.date}`;

    // Table
    document.getElementById('dt-table').innerHTML = '<table><thead><tr>' +
      '<th>#</th><th>代码</th><th>名称</th><th>上榜原因</th>' +
      '<th class="text-right">收盘价</th><th class="text-right">涨跌幅</th>' +
      '<th class="text-right">净买入(万)</th><th class="text-right">买入(万)</th>' +
      '<th class="text-right">卖出(万)</th><th class="text-right">换手率</th>' +
      '</tr></thead><tbody>' +
      stocks.map((s, i) => {
        const netColor = s.net_buy_wan >= 0 ? 'text-emerald-400' : 'text-red-400';
        const chgColor = s.change_pct >= 0 ? 'text-emerald-400' : 'text-red-400';
        return `<tr>
          <td class="text-center text-gray-400">${i + 1}</td>
          <td class="text-gray-300">${s.code}</td>
          <td class="text-white font-medium">${s.name}</td>
          <td class="text-xs text-gray-400 max-w-xs truncate">${s.reason || '--'}</td>
          <td class="text-right">¥${s.close.toFixed(2)}</td>
          <td class="text-right ${chgColor}">${s.change_pct >= 0 ? '+' : ''}${s.change_pct}%</td>
          <td class="text-right font-medium ${netColor}">${s.net_buy_wan.toFixed(1)}</td>
          <td class="text-right text-emerald-400">${s.buy_wan.toFixed(1)}</td>
          <td class="text-right text-red-400">${s.sell_wan.toFixed(1)}</td>
          <td class="text-right">${s.turnover_pct}%</td>
        </tr>`;
      }).join('') + '</tbody></table>';

    // Top 10 net buy bar chart
    renderDtTopChart(stocks);
    // Reason distribution
    renderDtReasonChart(stocks);

    status.textContent = `✅ 完成 — ${stocks.length} 条`;
    document.getElementById('dt-results').classList.remove('hidden');

  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
}

function renderDtTopChart(stocks) {
  const sorted = [...stocks].sort((a, b) => Math.abs(b.net_buy_wan) - Math.abs(a.net_buy_wan)).slice(0, 10);
  const ctx = document.getElementById('chart-dt-top').getContext('2d');
  dtChartInstances.top = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.name),
      datasets: [{
        label: '净买入(万元)',
        data: sorted.map(s => s.net_buy_wan),
        backgroundColor: sorted.map(s => s.net_buy_wan >= 0 ? 'rgba(52,211,153,0.7)' : 'rgba(248,113,113,0.7)'),
        borderColor: sorted.map(s => s.net_buy_wan >= 0 ? '#34d399' : '#f87171'),
        borderWidth: 1,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#1e293b', titleColor: '#fff', bodyColor: '#d1d5db',
          callbacks: { label: ctx => ctx.parsed.x.toFixed(1) + ' 万' } },
      },
      scales: {
        x: { ticks: { color: '#6b7280' }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { display: false } },
      },
    },
  });
}

function renderDtReasonChart(stocks) {
  const reasons = {};
  stocks.forEach(s => {
    const r = s.reason || '其他';
    reasons[r] = (reasons[r] || 0) + 1;
  });
  const labels = Object.keys(reasons);
  const values = Object.values(reasons);
  const colors = ['#818cf8','#34d399','#fbbf24','#f87171','#60a5fa','#c084fc','#fb923c'];

  const ctx = document.getElementById('chart-dt-reason').getContext('2d');
  dtChartInstances.reason = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors.slice(0, labels.length),
        borderColor: '#1e293b',
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#9ca3af', boxWidth: 10, padding: 8, font: { size: 10 } },
        },
        tooltip: { backgroundColor: '#1e293b', titleColor: '#fff', bodyColor: '#d1d5db' },
      },
    },
  });
}

function destroyDtCharts() {
  Object.values(dtChartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
  dtChartInstances = {};
}

loadDragonTiger();
</script>
{% endblock %}
