{% extends "base.html" %}
{% block title %}动量决策终端 — AStock WebUI{% endblock %}
{% block head_extra %}
<style>
/* ── Streamlit 无缝容器外壳 ── */
.st-frame-wrap {
  width: 100%;
  height: calc(100vh - 60px);
  overflow: hidden;
  background-color: #131722;
}
.st-frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
{% endblock %}

{% block content %}
<div class="st-frame-wrap">
  <iframe
    src="http://127.0.0.1:8501"
    allow="clipboard-read; clipboard-write"
    loading="lazy"
    title="动量决策终端"
  ></iframe>
</div>
{% endblock %}
