{% extends "base.html" %}
{% block title %}每日市场复盘 — AStock Pro A股研究与量化平台{% endblock %}
{% block content %}
<style>
.dr-grid { display: grid; gap: 12px; }
.dr-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 900px) { .dr-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .dr-row { grid-template-columns: 1fr; } }
.dr-card {
  background: linear-gradient(145deg, #1c2538 0%, #141d2e 100%);
  border: 1px solid #1e2a3a; border-radius: 8px; padding: 16px;
  position: relative; overflow: hidden;
}
.dr-card:hover { border-color: #2a3a5a; }
.dr-card-title { font-size: 11px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 8px; }
.dr-value { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; line-height: 1.1; }
.dr-change { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; margin-left: 8px; }
.dr-change.up { color: #f23645; }
.dr-change.down { color: #089981; }
.dr-change.flat { color: #787b86; }
.dr-label { font-size: 11px; color: #4a5a6a; margin-top: 2px; }
.dr-section-title { font-size: 13px; font-weight: 600; color: #d1d4dc; margin-bottom: 10px; letter-spacing: 0.3px; }
.dr-section-break { height: 1px; background: linear-gradient(90deg, #1e2a3a, transparent); margin: 16px 0; }
.dr-empty { color: #3a4a5a; font-size: 12px; text-align: center; padding: 20px 0; }

/* Tables */
.dr-table-wrap { overflow-x: auto; }
.dr-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.dr-table th {
  text-align: left; padding: 8px 10px; font-size: 10px;
  color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px;
  font-weight: 600; border-bottom: 1px solid #1e2a3a;
}
.dr-table td { padding: 8px 10px; border-bottom: 1px solid #131722; color: #d1d4dc; }
.dr-table tr:hover td { background: rgba(255,255,255,0.02); }
.dr-table .rank { color: #787b86; font-family: 'JetBrains Mono', monospace; }
.dr-table .symbol { font-family: 'JetBrains Mono', monospace; color: #2962FF; }
.dr-table .price { font-family: 'JetBrains Mono', monospace; text-align: right; }
.dr-table .pct { font-family: 'JetBrains Mono', monospace; text-align: right; font-weight: 600; }

/* Sector tags */
.dr-sector-tag {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 10px; font-weight: 600; margin: 2px;
}
.dr-sector-tag.up { background: rgba(242,54,69,0.12); color: #f23645; }
.dr-sector-tag.down { background: rgba(8,153,129,0.12); color: #089981; }
.dr-sector-tag.flat { background: rgba(120,123,134,0.12); color: #787b86; }

/* Date picker */
.dr-date-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.dr-date-input {
  background: #1e222d; border: 1px solid #2a2e39; border-radius: 4px;
  color: #d1d4dc; padding: 6px 10px; font-size: 12px; font-family: 'JetBrains Mono', monospace;
  outline: none; width: 150px;
}
.dr-date-input:focus { border-color: #2962FF; }
.dr-btn {
  background: #2962FF; color: #fff; border: none; border-radius: 4px;
  padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.dr-btn:hover { background: #1a4fd0; }
.dr-btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Loading */
.dr-loading { text-align: center; padding: 40px 0; color: #787b86; font-size: 13px; }
</style>

<div class="dr-grid">
  <!-- ── Page Header ── -->
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="dr-section-title" style="margin:0;">📊 每日市场复盘</div>
  </div>

  <!-- ── Date Bar ── -->
  <div class="dr-date-bar">
    <label style="font-size:11px;color:#4a5a6a;font-weight:600;">日期</label>
    <input type="date" class="dr-date-input" id="dr-date" value="{{ today }}">
    <button class="dr-btn" id="dr-refresh" onclick="loadReview()">刷新</button>
    <span id="dr-status" style="font-size:11px;color:#787b86;margin-left:8px;"></span>
  </div>

  <!-- ── Index Cards ── -->
  <div class="dr-section-title">📈 主要指数</div>
  <div class="dr-row" id="dr-indices">
    <div class="dr-loading">加载指数数据...</div>
  </div>

  <div class="dr-section-break"></div>

  <!-- ── Sector Rotation ── -->
  <div class="dr-section-title">🏭 板块轮动</div>
  <div id="dr-sectors">
    <div class="dr-loading">加载板块数据...</div>
  </div>

  <div class="dr-section-break"></div>

  <!-- ── Top Gainers / Losers ── -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <div class="dr-section-title" style="color:#f23645;">🔥 涨幅前十</div>
      <div class="dr-card" id="dr-gainers" style="padding:0;">
        <div class="dr-loading">加载数据...</div>
      </div>
    </div>
    <div>
      <div class="dr-section-title" style="color:#089981;">❄️ 跌幅前十</div>
      <div class="dr-card" id="dr-losers" style="padding:0;">
        <div class="dr-loading">加载数据...</div>
      </div>
    </div>
  </div>
</div>

<script>
async function loadReview() {
  const date = document.getElementById('dr-date').value;
  const status = document.getElementById('dr-status');
  const btn = document.getElementById('dr-refresh');
  btn.disabled = true;
  status.textContent = '加载中...';

  try {
    const resp = await fetch(`/api/v1/daily/review?date=${date}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = APIClient.unwrap(await resp.json());
    renderIndices(data.indices);
    renderSectors(data.sectors);
    renderMovers('dr-gainers', data.top_gainers, true);
    renderMovers('dr-losers', data.top_losers, false);
    status.textContent = `✅ ${data.date} 已更新`;
  } catch (err) {
    status.textContent = `❌ 加载失败: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

function renderIndices(indices) {
  const container = document.getElementById('dr-indices');
  if (!indices || indices.length === 0) {
    container.innerHTML = '<div class="dr-empty">暂无指数数据</div>';
    return;
  }

  container.innerHTML = indices.map(idx => {
    const chg = parseFloat(idx.change_pct) || 0;
    const chgClass = chg > 0 ? 'up' : (chg < 0 ? 'down' : 'flat');
    const sign = chg > 0 ? '+' : '';
    return `
      <div class="dr-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-size:12px;font-weight:600;color:#d1d4dc;">${idx.name || idx.symbol}</div>
            <div style="font-size:10px;color:#4a5a6a;margin-top:2px;">${idx.symbol}</div>
          </div>
          <div style="text-align:right;">
            <div class="dr-value" style="color:#fff;">${formatNum(idx.current)}</div>
            <div style="margin-top:4px;">
              <span class="dr-change ${chgClass}">${sign}${chg.toFixed(2)}%</span>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid #1e2a3a;">
          <div>
            <div class="dr-label">成交量</div>
            <div style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#d1d4dc;">${formatVol(idx.volume)}</div>
          </div>
          <div>
            <div class="dr-label">成交额</div>
            <div style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#d1d4dc;">${formatAmt(idx.amount)}</div>
          </div>
          <div>
            <div class="dr-label">振幅</div>
            <div style="font-size:12px;font-family:'JetBrains Mono',monospace;color:#d1d4dc;">${idx.high && idx.low ? ((idx.high - idx.low) / (idx.pre_close || 1) * 100).toFixed(2) + '%' : '-'}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderSectors(sectors) {
  const container = document.getElementById('dr-sectors');
  if (!sectors || sectors.length === 0) {
    container.innerHTML = '<div class="dr-empty">暂无板块数据</div>';
    return;
  }

  const items = sectors.slice(0, 20);
  container.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${items.map(s => {
        const chg = parseFloat(s.change_pct || s.change || 0);
        const cls = chg > 0 ? 'up' : (chg < 0 ? 'down' : 'flat');
        const sign = chg > 0 ? '+' : '';
        return `<span class="dr-sector-tag ${cls}">${s.name || s.sector || '未知'} ${sign}${chg.toFixed(2)}%</span>`;
      }).join('')}
    </div>
  `;
}

function renderMovers(containerId, items, isUp) {
  const container = document.getElementById(containerId);
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="dr-empty" style="padding:20px;">暂无数据</div>';
    return;
  }

  const topN = items.slice(0, 10);
  const color = isUp ? '#f23645' : '#089981';
  container.innerHTML = `
    <div class="dr-table-wrap">
      <table class="dr-table">
        <thead>
          <tr>
            <th>#</th>
            <th>代码</th>
            <th>名称</th>
            <th class="price">价格</th>
            <th class="pct" style="color:${color};">涨幅</th>
          </tr>
        </thead>
        <tbody>
          ${topN.map((item, i) => {
            const chg = parseFloat(item.change_pct || item.change || 0);
            const sign = chg > 0 ? '+' : '';
            return `
              <tr>
                <td class="rank">${i + 1}</td>
                <td class="symbol">${item.symbol || '-'}</td>
                <td>${item.name || item.stock_name || '-'}</td>
                <td class="price">${formatNum(item.current || item.price || 0)}</td>
                <td class="pct" style="color:${chg > 0 ? '#f23645' : (chg < 0 ? '#089981' : '#787b86')};">${sign}${chg.toFixed(2)}%</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function formatNum(n) {
  const v = parseFloat(n) || 0;
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatVol(v) {
  const n = parseFloat(v) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
  return n.toFixed(0);
}

function formatAmt(v) {
  const n = parseFloat(v) || 0;
  if (n >= 1e12) return (n / 1e12).toFixed(2) + '万亿';
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
  return n.toFixed(0);
}

// Load on page ready
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('dr-date').value = today;
  loadReview();
});
</script>
{% endblock %}
