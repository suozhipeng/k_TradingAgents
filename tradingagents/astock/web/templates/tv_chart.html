{% extends "base.html" %}
{% block title %}TV Chart — {{ symbol }}{% endblock %}
{% block content %}
<style>
#tv-chart { width: 100%; height: calc(100vh - 120px); min-height: 500px; }
.tv-topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #1e222d; border-bottom: 1px solid #2a2e39; }
.tv-topbar input { background: #131722; border: 1px solid #2a2e39; border-radius: 4px; padding: 4px 10px; font-size: 12px; color: #d1d4dc; outline: none; width: 140px; }
.tv-topbar input:focus { border-color: #2962FF; }
.tv-topbar button { padding: 4px 14px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; background: #2962FF; color: #fff; }
.tv-topbar button:hover { background: #1a4fd0; }
.tv-topbar .sep { width: 1px; height: 20px; background: #2a2e39; }
.tv-topbar .label { font-size: 11px; color: #787b86; }
.tv-topbar a { font-size: 12px; color: #2962FF; text-decoration: none; }
.tv-topbar a:hover { text-decoration: underline; }
</style>

<div class="tv-topbar">
  <span class="label">📊 TradingView</span>
  <div class="sep"></div>
  <div class="search-wrap"><input type="text" id="tv-symbol-input" value="{{ symbol }}" placeholder="600519.SH"></div>
  <button onclick="loadTVChart()">加载</button>
  <div class="sep"></div>
  <a href="/research?symbol={{ symbol }}">← 返回 Research</a>
  <span class="label" id="tv-status" style="margin-left:auto;color:#787b86"></span>
</div>

<div id="tv-chart"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('web.static', filename='tv/datafeed.js') }}"></script>
<script>
const TV_CHARTING_LIB_PATH = '{{ url_for("web.static", filename="tv/charting_library") }}';

function getSymbol() {
  return document.getElementById('tv-symbol-input').value.trim() || '600519.SH';
}

async function loadTVChart() {
  const symbol = getSymbol();
  const status = document.getElementById('tv-status');
  const container = document.getElementById('tv-chart');
  container.innerHTML = '';
  status.textContent = '⏳ 加载 Charting Library...';

  // Check if charting_library is available
  if (typeof TradingView === 'undefined') {
    // Try loading the charting_library
    try {
      await loadScript(`${TV_CHARTING_LIB_PATH}/charting_library.min.js`);
    } catch (e) {
      status.textContent = '❌ Charting Library 未安装。请从 TradingView 下载并放置到 static/tv/charting_library/';
      container.innerHTML = `<div style="padding:40px;text-align:center;color:#787b86">
        <h3 style="color:#f23645">Charting Library 未找到</h3>
        <p style="margin-top:12px;font-size:13px">需要下载 TradingView Charting Library 并放置在以下路径：</p>
        <code style="display:block;margin-top:8px;padding:8px 12px;background:#131722;border-radius:4px;font-size:12px">
          tradingagents/astock/web/static/tv/charting_library/<br>
          ├── charting_library.min.js<br>
          ├── charting_library.min.css<br>
          └── static/<br>
        </code>
        <p style="margin-top:12px;font-size:12px">下载地址：
          <a href="https://www.tradingview.com/HTML5-stock-forex-bitcoin-charting-library/" target="_blank" style="color:#2962FF">TradingView Charting Library</a>
        </p>
      </div>`;
      return;
    }
  }

  status.textContent = '⏳ 加载图表...';

  const datafeed = new AStockTVDatafeed();
  const widget = new TradingView.widget({
    container_id: 'tv-chart',
    symbol: symbol,
    interval: 'D',
    timezone: 'Asia/Shanghai',
    theme: 'Dark',
    style: '1',
    locale: 'zh_CN',
    toolbar_bg: '#1e222d',
    enable_publishing: false,
    hide_side_toolbar: false,
    allow_symbol_change: false,
    autosize: true,
    datafeed: datafeed,
    library_path: TV_CHARTING_LIB_PATH + '/',
    custom_css_url: TV_CHARTING_LIB_PATH + '/static/charting_library.css',
    studies_overrides: {},
    overrides: {
      'mainSeriesProperties.style': 1,
      'paneProperties.background': '#131722',
      'paneProperties.vertGridProperties.color': '#1e222d',
      'paneProperties.horzGridProperties.color': '#1e222d',
      'scalesProperties.textColor': '#787b86',
    },
    disabled_features: [
      'use_localstorage_for_settings',
      'header_saveload',
      'header_compare',
      'header_undo_redo',
      'header_symbol_search',
    ],
    enabled_features: ['study_templates', 'show_left_toolbar_by_default'],
  });

  widget.onChartReady(() => {
    status.textContent = '✅ ' + symbol;
  });
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(script);
  });
}

// ── Search Suggestions ──
KCDataLoader.setupSearch('tv-symbol-input', symbol => { loadTVChart(); });

// Auto-load on page entry
loadTVChart();
</script>
{% endblock %}
