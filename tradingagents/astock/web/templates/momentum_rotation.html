{% extends "base.html" %}
{% block title %}Momentum Rotation — AStock WebUI{% endblock %}
{% block content %}
<h2 class="tv-section-title">🚀 龙头股动量轮动 Momentum Rotation</h2>

<div class="tv-grid-2 mb-6">
  <!-- Run Panel -->
  <div class="tv-card">
    <h3 class="tv-card-title">⚙️ 策略配置</h3>
    <div class="space-y-3">
      <div>
        <label class="tv-label">动量周期 N（天）</label>
        <input type="number" id="mr-n" value="20" min="5" max="120" class="tv-input w-24">
        <p class="text-[10px] tv-muted mt-0.5">动量计算窗口</p>
      </div>
      <div>
        <label class="tv-label">调仓间隔 K（天）</label>
        <input type="number" id="mr-k" value="5" min="1" max="60" class="tv-input w-24">
        <p class="text-[10px] tv-muted mt-0.5">每 K 个交易日调仓</p>
      </div>
      <div>
        <label class="tv-label">持仓数量 L（只）</label>
        <input type="number" id="mr-l" value="5" min="1" max="22" class="tv-input w-24">
        <p class="text-[10px] tv-muted mt-0.5">每次调仓持有标的数</p>
      </div>
      <div>
        <label class="tv-label">起始日期</label>
        <input type="date" id="mr-start" class="tv-input w-full">
      </div>
      <div>
        <label class="tv-label">结束日期</label>
        <input type="date" id="mr-end" class="tv-input w-full">
      </div>
      <button onclick="runMomentumRotation()" class="tv-btn tv-btn-primary w-full">🚀 运行回测</button>
      <div id="mr-status" class="text-xs tv-muted mt-2"></div>
    </div>
  </div>

  <!-- Metrics -->
  <div class="tv-card">
    <h3 class="tv-card-title">📊 绩效指标</h3>
    <div id="mr-metrics" class="tv-muted text-sm" style="min-height:200px;">配置参数后点击运行。</div>

    <!-- Stock Pool -->
    <div class="tv-divider"></div>
    <h4 class="tv-label" style="font-size:12px;margin-bottom:8px;">📋 龙头股标的池 (22只)</h4>
    <div id="mr-stock-pool" class="overflow-x-auto"></div>
  </div>
</div>

<!-- Chart -->
<div class="tv-card mb-6" id="mr-chart-card" style="display:none;">
  <h3 class="tv-card-title">📈 累计收益对比</h3>
  <canvas id="mr-chart" height="300"></canvas>
</div>

<!-- Results -->
<div id="mr-results" style="display:none;">
  <!-- Rebalance Trades -->
  <div class="tv-card mb-6">
    <h3 class="tv-card-title">🔄 调仓记录</h3>
    <div id="mr-trades" class="overflow-x-auto"></div>
  </div>

  <!-- Selection Frequency -->
  <div class="tv-card mb-6">
    <h3 class="tv-card-title">📊 个股选中频率</h3>
    <div id="mr-selection-freq" class="overflow-x-auto"></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
let mrChart = null;

function setDefaultDates() {
  const now = new Date();
  document.getElementById('mr-start').value = '2024-01-01';
  document.getElementById('mr-end').value = now.toISOString().slice(0, 10);
}

function renderStockPool() {
  const stocks = [
    ["600111.SH","北方稀土","有色"],["002460.SZ","赣锋锂业","有色"],["601899.SH","紫金矿业","有色"],
    ["600988.SH","赤峰黄金","有色"],["002230.SZ","科大讯飞","科技"],["300750.SZ","宁德时代","新能源"],
    ["002594.SZ","比亚迪","新能源"],["603259.SH","药明康德","医药"],["601939.SH","建设银行","金融"],
    ["688256.SH","寒武纪","科技"],["601606.SH","长城军工","军工"],["688981.SH","中芯国际","科技"],
    ["300502.SZ","新易盛","科技"],["601138.SH","工业富联","科技"],["300308.SZ","中际旭创","科技"],
    ["300476.SZ","胜宏科技","科技"],["300394.SZ","天孚通信","科技"],["688041.SH","海光信息","科技"],
    ["601336.SH","新华保险","金融"],["600519.SH","贵州茅台","消费"],["601288.SH","农业银行","金融"],
    ["601319.SH","中国人保","金融"],
  ];
  const el = document.getElementById('mr-stock-pool');
  el.innerHTML = '<table class="tv-table"><thead><tr><th>代码</th><th>名称</th><th>行业</th></tr></thead><tbody>' +
    stocks.map(s => `<tr><td class="font-mono text-xs">${s[0]}</td><td>${s[1]}</td><td><span class="tv-badge tv-badge-blue">${s[2]}</span></td></tr>`).join('') +
    '</tbody></table>';
}

async function runMomentumRotation() {
  const statusEl = document.getElementById('mr-status');
  const metricsEl = document.getElementById('mr-metrics');
  const start = document.getElementById('mr-start').value;
  const end = document.getElementById('mr-end').value;
  const n = document.getElementById('mr-n').value || 20;
  const k = document.getElementById('mr-k').value || 5;
  const l = document.getElementById('mr-l').value || 5;

  statusEl.textContent = '⏳ 运行中...';
  metricsEl.innerHTML = '<p class="tv-muted">计算中...</p>';

  try {
    const res = await fetch('/api/v1/market/momentum-rotation', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ start_date: start, end_date: end, n: parseInt(n), k: parseInt(k), l: parseInt(l) }),
    });
    const data = await res.json();

    if (data.error) {
      statusEl.textContent = '❌ ' + data.error;
      return;
    }

    statusEl.textContent = '✅ 完成';
    document.getElementById('mr-chart-card').style.display = 'block';
    document.getElementById('mr-results').style.display = 'block';

    // ── Metrics ──
    metricsEl.innerHTML = '<div class="grid grid-cols-2 gap-2">' +
      [
        ['策略收益', data.total_return != null ? (data.total_return * 100).toFixed(2) + '%' : '--'],
        ['年化收益', data.annualized_return != null ? (data.annualized_return * 100).toFixed(2) + '%' : '--'],
        ['夏普比率', data.sharpe_ratio != null ? data.sharpe_ratio.toFixed(4) : '--'],
        ['最大回撤', data.max_drawdown != null ? (data.max_drawdown * 100).toFixed(2) + '%' : '--'],
        ['胜率', data.win_rate != null ? (data.win_rate * 100).toFixed(1) + '%' : '--'],
        ['调仓次数', data.total_trades ?? '--'],
        ['科创50收益', data.benchmark_return != null ? (data.benchmark_return * 100).toFixed(2) + '%' : '--'],
        ['等权收益', data.equal_weight_return != null ? (data.equal_weight_return * 100).toFixed(2) + '%' : '--'],
      ].map(([k, v]) =>
        `<div class="tv-card p-2"><div class="tv-label">${k}</div><div class="text-sm font-bold font-mono">${v}</div></div>`
      ).join('') + '</div>';

    // ── Chart ──
    renderChart(data);

    // ── Trades ──
    const trades = data.trades || [];
    const tradesEl = document.getElementById('mr-trades');
    if (trades.length) {
      tradesEl.innerHTML = '<table class="tv-table"><thead><tr><th>#</th><th>日期</th><th>持仓</th></tr></thead><tbody>' +
        trades.map((t, i) => {
          const posStr = (t.positions || []).map(p => `${p.symbol} ${(p.weight * 100).toFixed(1)}%`).join(' ');
          return `<tr><td class="text-center tv-muted">${i + 1}</td><td class="text-xs">${t.date}</td><td class="text-xs">${posStr}</td></tr>`;
        }).join('') + '</tbody></table>';
    } else {
      tradesEl.innerHTML = '<p class="tv-muted">无调仓记录。</p>';
    }

    // ── Selection Frequency ──
    const freq = data.stock_selection_freq || {};
    const freqEl = document.getElementById('mr-selection-freq');
    const freqEntries = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    if (freqEntries.length) {
      const maxFreq = Math.max(...freqEntries.map(e => e[1]));
      freqEl.innerHTML = '<table class="tv-table"><thead><tr><th>代码</th><th>选中次数</th><th>占比</th></tr></thead><tbody>' +
        freqEntries.map(([sym, count]) => {
          const pct = ((count / maxFreq) * 100).toFixed(0);
          return `<tr>
            <td class="font-mono text-xs">${sym}</td>
            <td class="font-mono">${count}</td>
            <td><div style="background:#2a2e39;border-radius:3px;overflow:hidden;"><div style="width:${pct}%;background:#2962FF;height:6px;border-radius:3px;"></div></div></td>
          </tr>`;
        }).join('') + '</tbody></table>';
    } else {
      freqEl.innerHTML = '<p class="tv-muted">暂无选中数据。</p>';
    }

  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
  }
}

function renderChart(data) {
  if (mrChart) { try { mrChart.destroy(); } catch(e) {} }
  const dates = data.dates || [];
  const eq = data.equity_curve || [];
  const bm = data.benchmark_curve || [];
  const ew = data.equal_weight_curve || [];

  // Use periods for equity curves
  const periods = data.periods || [];
  const labels = periods.map(p => (p.period || '').substring(0, 10));
  const stratVal = periods.map(p => p.portfolio_value || 0);
  const bmVal = periods.map(p => p.benchmark_value || 0);
  const ewVal = periods.map(p => p.equal_weight_value || 0);

  // Normalize to percentage
  const base = stratVal[0] || 1;
  const stratPct = stratVal.map(v => ((v - base) / base) * 100);
  const bmPct = bmVal.map(v => ((v - base) / base) * 100);
  const ewPct = ewVal.map(v => ((v - base) / base) * 100);

  const chartLabels = labels.length ? labels : dates;

  const ctx = document.getElementById('mr-chart').getContext('2d');
  mrChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: chartLabels,
      datasets: [
        { label: '动量轮动策略', data: stratPct, borderColor: '#2962FF', backgroundColor: 'rgba(41,98,255,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
        bmPct.length ? { label: '科创50ETF', data: bmPct, borderColor: '#089981', backgroundColor: 'rgba(8,153,129,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2, borderDash: [5, 3] } : null,
        ewPct.length ? { label: '等权重组合', data: ewPct, borderColor: '#f23645', backgroundColor: 'rgba(242,54,69,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2, borderDash: [3, 3] } : null,
      ].filter(Boolean),
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#9ca3af', boxWidth: 12, padding: 12, font: { size: 11 } } },
        tooltip: { backgroundColor: '#1e222d', titleColor: '#fff', bodyColor: '#d1d5db', borderColor: '#2a2e39', borderWidth: 1 },
      },
      scales: {
        x: { ticks: { color: '#6b7280', maxTicksLimit: 10, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { color: '#6b7280', callback: v => v.toFixed(1) + '%' }, grid: { color: '#1e293b' } },
      },
    },
  });
}

setDefaultDates();
renderStockPool();
</script>
{% endblock %}
