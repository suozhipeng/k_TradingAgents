<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AStock WebUI{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0f172a', card: '#1e293b', hover: '#334155', border: '#334155' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .sidebar-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors; }
    .sidebar-link:hover { @apply bg-dark-hover text-white; }
    .sidebar-link.active { @apply bg-indigo-600 text-white; }
    .card { @apply bg-dark-card rounded-xl border border-dark-border p-5; }
    .stat-value { @apply text-2xl font-bold text-white; }
    .stat-label { @apply text-xs text-gray-400 uppercase tracking-wider; }
    .btn { @apply px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
    .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
    .btn-secondary { @apply bg-dark-hover text-gray-300 hover:bg-gray-600; }
    .badge { @apply inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium; }
    .badge-success { @apply bg-emerald-900/50 text-emerald-400; }
    .badge-warning { @apply bg-amber-900/50 text-amber-400; }
    .badge-error { @apply bg-red-900/50 text-red-400; }
    .badge-info { @apply bg-sky-900/50 text-sky-400; }
    table { @apply w-full text-sm; }
    th { @apply text-left text-xs text-gray-400 uppercase tracking-wider pb-2; }
    td { @apply py-2 text-gray-300 border-b border-dark-border; }
    input, select { @apply bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-dark-bg text-gray-200 min-h-screen">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-dark-card border-r border-dark-border flex flex-col shrink-0">
      <div class="p-5 border-b border-dark-border">
        <h1 class="text-lg font-bold text-white tracking-tight">📈 AStock</h1>
        <p class="text-xs text-gray-500 mt-0.5">WebUI v0.1.0</p>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="sidebar-nav">
        <a href="/" class="sidebar-link" data-page="dashboard">📊 总览 Dashboard</a>
        <a href="/research" class="sidebar-link" data-page="research">🔬 个股研究 Research</a>
        <a href="/backtest" class="sidebar-link" data-page="backtest">🔄 回测 Backtest</a>
        <a href="/strategies" class="sidebar-link" data-page="strategies">🧠 策略 Strategies</a>
        <a href="/paper" class="sidebar-link" data-page="paper">💼 模拟盘 Paper</a>
        <a href="/qmt" class="sidebar-link" data-page="qmt">🔗 QMT 桥接</a>
        <a href="/risk" class="sidebar-link" data-page="risk">⚠️ 风控 Risk</a>
        <a href="/reports" class="sidebar-link" data-page="reports">📄 报告 Reports</a>
        <a href="/performance" class="sidebar-link" data-page="performance">📊 绩效 Performance</a>
        <a href="/settings" class="sidebar-link" data-page="settings">⚙️ 设置 Settings</a>
      </nav>
      <div class="p-4 border-t border-dark-border text-xs text-gray-500">
        <p id="server-status" class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-gray-500"></span>
          Checking...
        </p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Highlight active sidebar link
    document.querySelectorAll('.sidebar-link').forEach(el => {
      if (el.getAttribute('href') === window.location.pathname) {
        el.classList.add('active');
      }
    });

    // Server health check
    fetch('/api/v1/health')
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById('server-status');
        if (d.status === 'ok') {
          el.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online v' + (d.version || '?');
        } else {
          el.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Degraded';
        }
      })
      .catch(() => {
        document.getElementById('server-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> Offline';
      });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
