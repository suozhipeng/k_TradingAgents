name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[astock-providers,test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q tradingagents
      - run: ASTOCK_TESTING=1 pytest -m 'not integration' --ignore=tests/test_deepseek_reasoning.py
